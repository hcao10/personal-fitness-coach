name = "cmine-fit-automation"
main = "src/index.ts"
compatibility_date = "2026-04-01"
# account_id intentionally not committed: local deploys resolve it from the
# wrangler login; CI must provide CLOUDFLARE_ACCOUNT_ID via environment.
workers_dev = true
preview_urls = false

[triggers]
# 17 3 * * *  — daily maintenance (image retention, GC)
# 3 * * * *   — hourly notification dispatch (cue-time reminders, weekly letters)
crons = ["17 3 * * *", "3 * * * *"]

[vars]
FIT_ORIGIN = "https://fit.chwjh.com"

[observability]
enabled = true
head_sampling_rate = 0.1
