name: CI

on:
  push:
    branches: [main, codex/fitness-model-hub]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build and test
        run: npm test
      - name: No fabricated model IDs
        run: |
          if grep -rn --include='*.ts' --include='*.tsx' --include='*.mjs' -e 'gpt-5\.6' -e 'kimi-k2\.6' worker app packages cloudflare tests; then
            echo 'Fabricated model IDs found in source.' >&2
            exit 1
          fi
